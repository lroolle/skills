<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SLOT: tool title</title>
<style>
  :root {
    --bg:       #faf9f7;
    --surface:  #ffffff;
    --ink:      #1d1d20;
    --ink-2:    #5c5c66;
    --rule:     #e6e4de;
    --accent:   #1a6db0;
    --ok:       #166534;
    --warn:     #b45309;
    --bad:      #b91c1c;
    --sans: ui-sans-serif, system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:      #131316;
      --surface: #1c1c21;
      --ink:     #ececf0;
      --ink-2:   #9c9ca8;
      --rule:    #2c2c33;
      --accent:  #5aa3dd;
      --ok:      #4ade80;
      --warn:    #fbbf24;
      --bad:     #f87171;
    }
  }

  * { box-sizing: border-box; }
  body {
    font: 14px/1.45 var(--sans);
    background: var(--bg);
    color: var(--ink);
    margin: 0;
  }

  .toolbar {
    position: sticky;
    top: 0;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.6rem 1rem;
    background: var(--surface);
    border-bottom: 1px solid var(--rule);
  }
  .toolbar .title { font-weight: 600; }
  .toolbar .count { color: var(--ink-2); }
  .toolbar .spacer { flex: 1; }

  button {
    font: inherit;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 0.35rem 0.8rem;
    cursor: pointer;
    transition: border-color 150ms ease-out;
  }
  button:hover { border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media (prefers-reduced-motion: reduce) {
    button { transition: none; }
  }

  main { padding: 1rem; }

  .ok   { color: var(--ok); }
  .warn { color: var(--warn); }
  .bad  { color: var(--bad); }

  .help {
    position: fixed;
    right: 1rem;
    bottom: 1rem;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 0.75rem 1rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    font-size: 0.9em;
  }
  .help kbd {
    font-family: var(--mono);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 0 0.3em;
  }

  @media print { .toolbar, .help { display: none; } }
</style>
</head>
<body>

<header class="toolbar">
  <span class="title">SLOT: Tool title</span>
  <span class="count" id="count"></span>
  <span class="spacer"></span>
  <button id="help-btn" aria-label="Keyboard shortcuts">?</button>
  <!-- SLOT: export label matches the format: "Copy as markdown",
       "Copy as JSON", "Copy as diff" -- see references/export.md -->
  <button id="export-btn" class="primary">Copy as markdown</button>
</header>

<main id="work">
  <!-- SLOT: the working surface. Built by render() below from the
       embedded data -- never hand-write rows that JS also writes. -->
</main>

<section class="help" id="help" hidden>
  <!-- SLOT: list the real shortcuts this tool ships -->
  <div><kbd>?</kbd> toggle this panel</div>
</section>

<!-- Task data lives in a non-executing JSON block, separated from
     behavior. Escape every </ in string values as <\/ or the
     document truncates at the first </script> in the data. -->
<script id="task-data" type="application/json">
  {"items": []}
</script>

<script>
  'use strict';
  const data = JSON.parse(document.getElementById('task-data').textContent);
  // SLOT: replace {"items": []} above with the real task data.
  // Pre-populate; an empty editor is a failed artifact.

  let dirty = false;  // set on any edit, cleared by successful export
  addEventListener('beforeunload', (e) => {
    if (dirty) e.preventDefault();
  });

  const work = document.getElementById('work');
  function render() {
    work.replaceChildren();
    // SLOT: build the UI with createElement/textContent only.
    // Never assign innerHTML from anything containing data.
    for (const item of data.items) {
      const row = document.createElement('div');
      row.textContent = String(item);  // SLOT: real row structure
      work.appendChild(row);
    }
    document.getElementById('count').textContent =
      data.items.length + ' items';
  }
  render();

  function exportText() {
    // SLOT: serialize the current state in the format the export
    // button promises. Export the decisions, not the whole dump.
    return data.items.map(String).join('\n');
  }

  // Canonical clipboard contract (references/export.md):
  // navigator.clipboard rejects in sandboxed iframes and unfocused
  // documents; execCommand is the deliberate fallback.
  async function copyText(text, btn) {
    let ok = false;
    try {
      await navigator.clipboard.writeText(text);
      ok = true;
    } catch {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      ok = document.execCommand('copy');
      ta.remove();
    }
    const old = btn.textContent;
    btn.textContent = ok ? 'Copied' : 'Copy failed -- select the text manually';
    setTimeout(() => { btn.textContent = old; }, 1500);
    return ok;
  }

  document.getElementById('export-btn').addEventListener('click', async (e) => {
    if (await copyText(exportText(), e.target)) dirty = false;
  });

  const help = document.getElementById('help');
  document.getElementById('help-btn').addEventListener('click', () => {
    help.hidden = !help.hidden;
  });
  addEventListener('keydown', (e) => {
    if (e.target.matches('input, textarea, select')) return;
    if (e.key === '?') help.hidden = !help.hidden;
    // SLOT: j/k to move, y/n to judge -- if the user will process
    // more than a few items, shortcuts are required, and every
    // shortcut action must also work by tab and click.
  });
</script>
</body>
</html>
